[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "free-llm-server"
version = "0.1.0"
description = "One command to run your own free OpenAI-compatible LLM server on Kaggle's free GPUs and wire it to any client."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AlexTheSomething" }]
keywords = ["kaggle", "llm", "ollama", "openai", "free"]
classifiers = ["Environment :: Console", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.scripts]
fls = "free_llm_server.cli:main"

[tool.setuptools.packages.find]
include = ["free_llm_server*"]

[tool.setuptools.package-data]
free_llm_server = ["kaggle_kernel.py"]
